<div class="min-h-screen bg-[#1a1a2e] text-base-content p-4 md:p-8 font-sans">
  
  <header class="text-center mb-10 mt-4">
    <h1 class="text-4xl md:text-5xl font-extrabold text-primary drop-shadow-md">⚔️ RPG Arena</h1>
    <p class="text-base-content/60 mt-2 tracking-widest uppercase text-sm">Batalhas Épicas em Rede</p>
  </header>

  <div class="container mx-auto max-w-6xl">
    @if (!isConnected) {
      <app-rpg-login></app-rpg-login>
    } @else {
      <div class="flex flex-col gap-8 animate-fade-in">
        <app-rpg-chat></app-rpg-chat>
        <div class="divider before:bg-primary/20 after:bg-primary/20"></div>
        <app-rpg-battle></app-rpg-battle>
      </div>
    }
  </div>

</div>
